<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Russemerch</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .admin-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: var(--spacing-sm);
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-secondary);
        }
        .form-group input[type="text"],
        .form-group input[type="number"],
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-surface);
            color: var(--text-primary);
            border: 1px solid var(--text-secondary);
            border-radius: var(--border-radius);
            font-family: var(--font-family);
        }
        .checkbox-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--text-primary);
        }
        .product-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background-color: var(--bg-surface);
            border-radius: var(--border-radius);
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="container nav-container">
            <div class="logo"><a href="index.html">Russemerch</a></div>
            <nav>
                <ul>
                    <li><a href="index.html">Hjem</a></li>
                    <li><a href="shop.html">Butikk</a></li>
                    <li><a href="admin.html">Admin</a></li>
                    <li>
                        <div class="cart" onclick="openCart()" style="cursor: pointer;">
                            <i class="fas fa-shopping-cart"></i>
                            <span id="cart-badge">0</span>
                        </div>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Handlekurv Overlay (Slide-in) -->
    <div id="cart-overlay" class="cart-overlay">
        <div class="cart-sidebar">
            <div class="cart-header">
                <h2>Handlekurv</h2>
                <button class="close-cart" onclick="closeCart()">&times;</button>
            </div>
            <div id="cart-items" class="cart-items">
                <!-- Handlekurv innhold genereres med JS -->
            </div>
            <div class="cart-footer">
                <div class="cart-total">
                    <span>Totalt:</span>
                    <span id="cart-total-price">0 kr</span>
                </div>
                <button class="btn btn-primary btn-checkout">Gå til kasse</button>
            </div>
        </div>
    </div>

    <!-- Admin Section -->
    <section class="container" style="padding: var(--spacing-lg) 0;">
        <div class="admin-container">
            <h1 style="text-align: center; text-transform: uppercase; margin-bottom: var(--spacing-md);">Legg til nytt produkt</h1>

            <form id="add-product-form" style="background-color: var(--bg-color); padding: var(--spacing-md); border-radius: var(--border-radius); border: 1px solid rgba(255,255,255,0.1); margin-bottom: var(--spacing-lg);">
                <div class="form-group">
                    <label for="product-name">Tittel</label>
                    <input type="text" id="product-name" required>
                </div>

                <div class="form-group">
                    <label for="product-price">Pris (kr)</label>
                    <input type="number" id="product-price" required min="0">
                </div>

                <div class="form-group">
                    <label for="product-category">Kategori</label>
                    <select id="product-category" required>
                        <option value="Gensere">Gensere</option>
                        <option value="Hettegensere">Hettegensere</option>
                        <option value="Bukser">Bukser</option>
                        <option value="Jakker">Jakker</option>
                        <option value="Tilbehør">Tilbehør</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="product-desc">Beskrivelse</label>
                    <textarea id="product-desc" rows="3" required></textarea>
                </div>

                <div class="form-group">
                    <label for="product-image">Bilde-URL</label>
                    <input type="text" id="product-image" required placeholder="https://via.placeholder.com/400x500">
                </div>

                <div class="form-group">
                    <label>Størrelser</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="size" value="XS"> XS</label>
                        <label><input type="checkbox" name="size" value="S"> S</label>
                        <label><input type="checkbox" name="size" value="M"> M</label>
                        <label><input type="checkbox" name="size" value="L"> L</label>
                        <label><input type="checkbox" name="size" value="XL"> XL</label>
                        <label><input type="checkbox" name="size" value="One Size"> One Size</label>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">Legg til produkt</button>
            </form>

            <h2 style="text-align: center; text-transform: uppercase; margin-bottom: var(--spacing-md);">Alle produkter</h2>
            <div id="admin-product-list">
                <!-- Genereres av JS -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2024 Russemerch. Alle rettigheter reservert.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="cart.js"></script>
    <script src="admin.js"></script>
</body>
</html>
